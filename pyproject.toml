[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pysoar"
version = "0.4.0"
description = "A lightweight Python SOAR framework for edge and SOHO networks"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "GPL-3.0-or-later" }
authors = [{ name = "PySOAR Contributors" }]
dependencies = [
    "pymisp>=2.5.34,<2.6",
    "PyYAML>=6.0.1",
    "requests>=2.31.0",
    "pyflowchart>=0.3.1",
    "cryptography>=41.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "responses>=0.25.0",
]
api = [
    "fastapi>=0.110.0",
    "uvicorn>=0.27.0",
    "apscheduler>=3.10.4",
    "httpx>=0.27.0",
]

[project.scripts]
pysoar = "pysoar:main_cli"

[tool.setuptools.packages.find]
include = ["integrations*"]

[tool.setuptools]
py-modules = [
    "classes",
    "menu",
    "pysoar",
    "secrets_manager",
    "triggers",
    "playbook_validator",
    "scheduler",
    "api_server",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
